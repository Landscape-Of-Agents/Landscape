name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, check, test, and smoke test
    runs-on: ubuntu-latest
    env:
      # Test runs never upload to the production ingestion service
      CRANE_INGEST_URL: "off"

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile
        run: cargo check --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Clippy with the ingestion service
        run: cargo clippy --locked --all-targets --features server -- -D warnings

      - name: Test the ingestion service and the hosted dashboard (live MongoDB)
        env:
          CRANE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: cargo test --locked --features server --test ingestion --test dashboard

      - name: Run tests
        run: cargo test --locked

      - name: Build debug CLI for smoke test
        run: cargo build --locked

      - name: Build CLI
        run: cargo build --release --locked

      - name: Run smoke test
        run: bash scripts/smoke_test.sh

  extension:
    name: Foxx extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/foxx
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile and test
        run: npm test

      - name: Package the extension
        run: npm run package
