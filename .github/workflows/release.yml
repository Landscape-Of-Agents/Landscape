name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: crane-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          # The DataSea ingestion service compiled into the release, so uploads need no setup
          CRANE_DEFAULT_INGEST_URL: ${{ vars.CRANE_INGEST_URL }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="crane-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/crane" "$name/crane"
          cp README.md "$name/"
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* "$name/"; fi
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "crane-${env:RELEASE_TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\crane.exe" "$name\crane.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" "$name\README.md" }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: crane-${{ matrix.target }}
          path: |
            crane-*.tar.gz
            crane-*.zip
            crane-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Note the start time
        shell: bash
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out source for release smoke test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Full history and tags, to compare the extension with the previous release
          fetch-depth: 0

      - name: Verify release tag matches Cargo version
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${version}" = "${RELEASE_TAG}"

      - name: Download packaged binaries
        id: download
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: crane-*
          merge-multiple: true

      - name: Run packaged Linux binary smoke test
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/crane-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          CRANE_INGEST_URL=off CRANE_BIN="$PWD/unpacked/crane-${RELEASE_TAG}-x86_64-unknown-linux-gnu/crane" \
            bash scripts/smoke_test.sh

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the Landscape extension
        id: extension
        shell: bash
        working-directory: extensions/foxx
        run: |
          set -euo pipefail
          # The tag decides the extension's version, so only Cargo.toml is bumped by hand
          npm ci --no-audit --no-fund
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
          npm test
          npm run package
          mv foxx.vsix "../../dist/foxx-${RELEASE_TAG}.vsix"
          # Publish only when the extension changed since the previous release (or there is none)
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [ -z "${previous}" ] || ! git diff --quiet "${previous}" "${RELEASE_TAG}" -- .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The extension changed since ${previous:-the beginning}; it will be published."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The extension did not change since ${previous}; the Marketplace keeps its current version."
          fi

      - name: Publish the Landscape extension to the VS Code Marketplace
        id: marketplace
        if: steps.extension.outputs.changed == 'true'
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT}" ]; then
            echo "::warning::VSCE_PAT is not set; the extension was not published to the Marketplace."
            echo "skipped=NO_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd extensions/foxx
          npx vsce publish --packagePath "../../dist/foxx-${RELEASE_TAG}.vsix" --pat "${VSCE_PAT}"

      - name: Publish the Landscape extension to Open VSX
        id: openvsx
        if: steps.extension.outputs.changed == 'true'
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT}" ]; then
            echo "OVSX_PAT is not set; skipping Open VSX."
            echo "skipped=NO_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes ovsx@0.10.1 publish "dist/foxx-${RELEASE_TAG}.vsix" --pat "${OVSX_PAT}"

      - name: Create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*

      # DASHBOARD.md F33.2 and F33.3: the outcomes as event lines in this log
      - name: Record the outcome
        if: always() && steps.verify.outcome != 'skipped'
        shell: bash
        env:
          VERIFY: ${{ steps.verify.outcome }}
          BUILD: ${{ steps.download.outcome }} ${{ steps.smoke.outcome }} ${{ steps.extension.outcome }}
          UPLOAD: ${{ steps.release.outcome }}
          CHANGED: ${{ steps.extension.outputs.changed }}
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          MARKETPLACE_SKIPPED: ${{ steps.marketplace.outputs.skipped }}
          OPENVSX: ${{ steps.openvsx.outcome }}
          OPENVSX_SKIPPED: ${{ steps.openvsx.outputs.skipped }}
        run: |
          event() { python3 scripts/workflow_event.py "$@" action.action_source=CI "resource.resource_ids=[\"${GITHUB_SHA}\", \"${RELEASE_TAG}\"]" "other.version=${RELEASE_TAG#v}"; }
          failure=NA
          if [ "$VERIFY" = failure ]; then failure=VERSION_MISMATCH
          elif [[ "$BUILD" == *failure* ]]; then failure=BUILD
          elif [ "$UPLOAD" != success ]; then failure=UPLOAD
          fi
          if [ "$failure" = NA ]; then set -- SUCCESS INFO OK "Release published with every binary."; else set -- FAILURE HIGH FAILED "Release was not published."; fi
          event RELEASE_PUBLISHED F33 action.action_type=RELEASE \
            "response.response_status=$1" "response.failure_state=$failure" "response.response_statement=$4" \
            "severity.severity_status=$2" "bindings.binding_result=$3" 'bindings.third_party=["GITHUB_ACTIONS", "GITHUB"]' \
            "eval.assets=$(ls dist 2>/dev/null | wc -l)" "eval.duration_ms=$(( ($(date +%s) - STARTED_AT) * 1000 ))" \
            'other.targets=["X86_64_LINUX_GNU", "X86_64_WINDOWS_MSVC", "X86_64_APPLE_DARWIN", "AARCH64_APPLE_DARWIN"]'
          for registry in MARKETPLACE OPEN_VSX; do
            if [ "$registry" = MARKETPLACE ]; then outcome="$MARKETPLACE"; skipped="$MARKETPLACE_SKIPPED"; else outcome="$OPENVSX"; skipped="$OPENVSX_SKIPPED"; fi
            if [ "$CHANGED" != true ]; then set -- SKIPPED UNCHANGED INFO SKIPPED "Extension unchanged since the previous release."
            elif [ -n "$skipped" ]; then set -- SKIPPED "$skipped" MEDIUM SKIPPED "No publishing token; extension not published."
            elif [ "$outcome" = success ]; then set -- PUBLISHED NA INFO OK "Extension published."
            else set -- FAILED REJECTED MEDIUM FAILED "Registry rejected the extension."
            fi
            event EXTENSION_PUBLISHED F33 action.action_type=PUBLISH_EXTENSION \
              "response.response_status=$1" "response.failure_state=$2" "response.response_statement=$5" \
              "severity.severity_status=$3" "bindings.binding_result=$4" 'bindings.third_party=["VSCODE_MARKETPLACE", "OPEN_VSX"]' \
              "other.registry=$registry"
          done
