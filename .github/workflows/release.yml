name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: crane-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          # The Foxx ingestion service compiled into the release, so uploads need no setup
          CRANE_DEFAULT_INGEST_URL: ${{ vars.CRANE_INGEST_URL }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="crane-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/crane" "$name/crane"
          cp README.md "$name/"
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* "$name/"; fi
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "crane-${env:RELEASE_TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\crane.exe" "$name\crane.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" "$name\README.md" }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: crane-${{ matrix.target }}
          path: |
            crane-*.tar.gz
            crane-*.zip
            crane-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out source for release smoke test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${version}" = "${RELEASE_TAG}"

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: crane-*
          merge-multiple: true

      - name: Run packaged Linux binary smoke test
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/crane-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          CRANE_INGEST_URL=off CRANE_BIN="$PWD/unpacked/crane-${RELEASE_TAG}-x86_64-unknown-linux-gnu/crane" \
            bash scripts/smoke_test.sh

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the Foxx extension
        shell: bash
        working-directory: extensions/foxx
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${RELEASE_TAG}" || { echo "extensions/foxx/package.json is ${version}, the tag is ${RELEASE_TAG}"; exit 1; }
          npm ci --no-audit --no-fund
          npm test
          npm run package
          mv foxx.vsix "../../dist/foxx-${RELEASE_TAG}.vsix"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*
