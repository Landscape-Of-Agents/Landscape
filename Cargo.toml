[package]
name = "crane"
version = "0.4.23"
edition = "2021"
rust-version = "1.89"
description = "Crane: signed selection contracts, runtime enforcement, and security evidence for AI coding agents."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/VishuKalier2003/Agentscript"
homepage = "https://github.com/VishuKalier2003/Agentscript"

[features]
default = []
# The Foxx ingestion service ('crane server'), the only component that holds MongoDB credentials
server = ["dep:mongodb", "dep:tiny_http"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parsed floats must equal the written ones, or chained digests would not verify
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.3"
rpassword = "7"
# Passphrase protection of signing keys (CRANE_KEY_PROTECTION=prompt)
argon2 = "0.5"
chacha20poly1305 = "0.10"
# HTTPS client of the Foxx ingestion service
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tiny_http = { version = "0.12", optional = true }
mongodb = { version = "3", optional = true, default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver", "sync"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "crane"
path = "src/main.rs"

[[test]]
name = "ingestion"
path = "tests/ingestion.rs"
required-features = ["server"]

[[test]]
name = "dashboard"
path = "tests/dashboard.rs"
required-features = ["server"]
