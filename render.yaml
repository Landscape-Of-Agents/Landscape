# Render Blueprint for the Agent Landscape landing page: a static site built from landing/.
# The build compiles Tailwind CSS (landing/src/input.css -> landing/public/styles.css). Release
# downloads, download totals, and the visit counter are read in the browser, so a new Crane
# release appears without redeploying. Only changes under landing/ redeploy it.
# This Blueprint manages this static site and the operator dashboard; the DataSea ingestion service
# is configured separately.
services:
  - type: web
    name: agent-landscape
    runtime: static
    rootDir: landing
    buildCommand: npm ci && npm run build
    staticPublishPath: public
    # Custom domains: point agentslandscape.cloud (and www) at this site in your DNS
    domains:
      - agentslandscape.cloud
      - www.agentslandscape.cloud
    autoDeploy: true
    buildFilter:
      paths:
        - landing/**
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.github.com https://abacus.jasoncameron.dev; form-action https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # styles.css and app.js keep their names across deploys, so browsers must check for a newer
      # copy on every load (unchanged files are not downloaded again)
      - path: /*.css
        name: Cache-Control
        value: no-cache
      - path: /*.js
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache

  # The operator dashboard (crane operator serve): the switch that lets AI agents run read-only Crane
  # commands. Only the GitHub logins in CRANE_OPERATOR_LOGINS can sign in. Same image as DataSea,
  # another command. Secrets (sync: false) are entered in the Render dashboard, never committed.
  - type: web
    name: crane-operator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: crane operator serve
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - src/**
        - Cargo.toml
        - Cargo.lock
        - build.rs
        - Dockerfile
    envVars:
      - key: CRANE_MONGODB_URI
        sync: false
      - key: CRANE_OPERATOR_DB
        value: crane_operator
      - key: CRANE_OPERATOR_SIGNING_KEY
        sync: false
      - key: CRANE_OPERATOR_LOGINS
        value: VishuKalier2003
      - key: CRANE_GITHUB_CLIENT_ID
        sync: false
      - key: CRANE_GITHUB_CLIENT_SECRET
        sync: false
