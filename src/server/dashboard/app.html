<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foxx Dashboard</title>
<meta name="description" content="Crane security observability for individuals and teams">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
/* Palette taken from the Foxx logo: ember orange to amber on charcoal, with cream highlights.
   Dark is the default; a warm light variant follows the system preference. */
:root {
  --bg: #0c0a09; --bg-glow: rgba(255, 106, 26, .08); --panel: #161210; --panel-2: #1d1814;
  --ink: #f7ede2; --muted: #ab9c8f; --line: #2e2520; --chip: #261e19;
  --accent: #ff7a1a; --accent-2: #ffb347; --accent-ink: #1a0d05;
  --ok: #7bd88f; --warn: #f5b34c; --bad: #ff6b5b; --crit: #ff8fa3;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 8px 24px rgba(0, 0, 0, .35);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #fbf6f0; --bg-glow: rgba(255, 122, 26, .07); --panel: #ffffff; --panel-2: #fff8f1;
    --ink: #22180f; --muted: #75655a; --line: #eddfd2; --chip: #f7ebdf;
    --accent: #e4610b; --accent-2: #f59e0b; --accent-ink: #ffffff;
    --ok: #1f7a46; --warn: #9a5b00; --bad: #b42318; --crit: #8b1030;
    --shadow: 0 1px 2px rgba(80, 40, 10, .06), 0 6px 18px rgba(80, 40, 10, .06);
  }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  background: radial-gradient(1200px 500px at 85% -10%, var(--bg-glow), transparent 60%), var(--bg); background-attachment: fixed; min-height: 100vh; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand img { width: 36px; height: 36px; filter: drop-shadow(0 0 8px rgba(255, 122, 26, .45)); }
.brand .name { font-size: 18px; font-weight: 700; letter-spacing: .3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .tag { font-size: 11px; color: var(--muted); display: block; margin-top: -2px; }
.scope { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
.scope label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; display: flex; gap: 6px; align-items: center; }
select, .filters input { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: inherit; max-width: 100%; }
select:focus, input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.viewer { color: var(--muted); font-size: 12px; }
nav.pages { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 8px 20px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 70%, transparent); }
nav.pages a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
nav.pages a:hover { color: var(--ink); background: var(--chip); }
nav.pages a.active { color: var(--accent-ink); background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
main { padding: 22px 20px 48px; max-width: 1280px; margin: 0 auto; }
h2 { font-size: 13px; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 12px; }
.tile { position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); overflow: hidden; }
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent); }
.tile .label { color: var(--muted); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .note { color: var(--muted); font-size: 11px; margin-top: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--panel-2); }
th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: var(--chip); color: var(--muted); margin: 1px 2px 1px 0; white-space: nowrap; border: 1px solid transparent; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.chip.crit { color: var(--crit); font-weight: 700; border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.muted { color: var(--muted); }
.member { white-space: nowrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
button { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--accent); }
.error { color: var(--bad); padding: 12px; }
details summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
.graph svg text { fill: var(--ink); font-size: 11px; }
.legend span { margin-right: 12px; }
.signin { max-width: 560px; margin: 56px auto; text-align: center; }
.signin .hero { width: 168px; height: 168px; filter: drop-shadow(0 0 28px rgba(255, 122, 26, .45)); }
.signin h2 { font-size: 26px; text-transform: none; letter-spacing: .2px; color: var(--ink); margin: 18px 0 8px; }
.signin a.button { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; padding: 11px 22px; border-radius: 999px; font-weight: 700;
  color: var(--accent-ink); text-decoration: none; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 24px rgba(255, 122, 26, .35); }
.signin a.button:hover { filter: brightness(1.05); }
@media (max-width: 640px) {
  main { padding: 14px 16px 40px; } header, nav.pages { padding: 10px 16px; }
  .scope { flex-basis: 100%; } .scope label { width: 100%; justify-content: space-between; } .scope select { width: 70%; }
  .viewer { flex-basis: 100%; } .brand .tag { display: none; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .tile .value { font-size: 20px; }
}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/overview" aria-label="Foxx dashboard home">
    <img src="/logo.png" alt="" width="36" height="36">
    <span><span class="name">Foxx</span><span class="tag">security observability for Crane</span></span>
  </a>
  <div id="scope" class="scope"></div>
  <span id="viewer" class="viewer"></span>
</header>
<nav id="nav" class="pages" aria-label="Pages"></nav>
<main id="main"><p class="muted">Loading…</p></main>
<script src="/app.js" defer></script>
</body>
</html>
