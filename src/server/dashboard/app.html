<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataSea</title>
<meta name="description" content="DataSea: your organization's knowledge, section by section. Engineering holds the repository's flows; every change is applied on a machine with Crane.">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<style>
/* DataSea: calm neutral surfaces separated by hairlines, sentence-case labels, and the fox logo's
   orange as the one accent; state colors are kept for states. A dark rail lists the organization's
   sections (Engineering holds Flows); the top bar holds the page name, the repository (on Flows),
   the theme, and the viewer. Light and dark follow the system unless chosen. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #111827; --ink-2: #374151; --muted: #5f6878; --line: #e7e9ee; --line-2: #d4d8e0; --hover: #f1f3f6;
  --accent: #c2410c; --accent-2: #ea6a2a; --accent-soft: #fff1e8; --accent-ink: #ffffff; --ember: #9a3412; --cream: #f1f3f7;
  --rail: #0f1217; --rail-2: #1a1e26; --rail-3: #2a2f39; --rail-ink: #e6e9ef; --rail-muted: #949cab;
  --ok: #067a37; --info: #1d63c4; --low: #0b7f77; --warn: #94600a; --bad: #c0262d; --crit: #a01650;
  --grid: #eef0f3; --axis: #c9ced8;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04);
  --shadow-lg: 0 12px 32px -8px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .06);
  --glow: rgba(234, 106, 42, .10);
  --radius: 12px; --radius-sm: 8px;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --bg: #0b0d11; --panel: #13161c; --panel-2: #181c23; --ink: #eef1f5; --ink-2: #c9cfd8; --muted: #959eac; --line: #22272f; --line-2: #333a45; --hover: #1c2129;
    --accent: #ff8a4c; --accent-2: #ffa873; --accent-soft: #2c1d15; --accent-ink: #1a0d06; --ember: #ffa06b;
    --rail: #08090c; --rail-2: #15181e; --rail-3: #252a33;
    --ok: #4ccb72; --info: #6cb0f5; --low: #4fcdc0; --warn: #f2b84b; --bad: #ff7a70; --crit: #ff7cb5;
    --grid: #1f242c; --axis: #3d4553;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 16px 40px -8px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .4);
    --glow: rgba(255, 138, 76, .09);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11; --panel: #13161c; --panel-2: #181c23; --ink: #eef1f5; --ink-2: #c9cfd8; --muted: #959eac; --line: #22272f; --line-2: #333a45; --hover: #1c2129;
  --accent: #ff8a4c; --accent-2: #ffa873; --accent-soft: #2c1d15; --accent-ink: #1a0d06; --ember: #ffa06b;
  --rail: #08090c; --rail-2: #15181e; --rail-3: #252a33;
  --ok: #4ccb72; --info: #6cb0f5; --low: #4fcdc0; --warn: #f2b84b; --bad: #ff7a70; --crit: #ff7cb5;
  --grid: #1f242c; --axis: #3d4553;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-lg: 0 16px 40px -8px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .4);
  --glow: rgba(255, 138, 76, .09);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); background: var(--bg); font: 14px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 4px; }
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Layout: the rail of sections, then the column with the top bar and the page */
.app { display: flex; min-height: 100vh; }
.rail { width: 236px; flex: none; background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 5; border-right: 1px solid rgba(255, 255, 255, .04); font-size: 13.5px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; color: var(--rail-ink); }
.brand:hover { text-decoration: none; }
.brand img { width: 32px; height: 32px; border-radius: 9px; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--rail-muted); font-size: 11.5px; }
.nav { display: grid; gap: 2px; padding: 6px 10px 16px; }
.nav-head { color: var(--rail-muted); font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; padding: 14px 8px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 8px; color: var(--rail-ink); opacity: .86; }
.nav a:hover { background: var(--rail-2); text-decoration: none; opacity: 1; }
.nav a.active { background: var(--rail-3); opacity: 1; box-shadow: inset 2px 0 0 var(--accent-2); }
.nav a svg { width: 16px; height: 16px; flex: none; color: var(--rail-muted); }
.nav a.active svg { color: var(--accent-2); }
.nav a .count { margin-left: auto; font: 600 10.5px/1 var(--mono); color: var(--rail-muted); }
.nav .sub { padding-left: 36px; font-size: 13px; }
.rail .foot { margin-top: auto; padding: 14px 16px; border-top: 1px solid var(--rail-2); color: var(--rail-muted); font-size: 12.5px; display: grid; gap: 6px; }
.rail .foot a { color: var(--rail-ink); }
.who { display: flex; align-items: center; gap: 8px; }
.avatar { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-2); color: #1a0d06; font-weight: 700; font-size: 12px; }
.column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
.crumbs .sep { color: var(--muted); }
.crumbs a { color: var(--ink-2); }
.topbar-spacer { flex: 1; }
.scope select { max-width: 280px; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--panel); }
.icon-btn { display: inline-grid; place-items: center; min-width: 30px; height: 30px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 0 6px; cursor: pointer; color: var(--muted); line-height: 1; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
#toggle { display: none; }
main { padding: 24px 28px 48px; width: 100%; max-width: 1480px; margin: 0 auto; }

/* Shared pieces */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); color: var(--ink); }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.large { padding: 10px 20px; font-size: 14px; }
.chip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-2); white-space: nowrap; line-height: 19px; letter-spacing: .01em; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.chip.info { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, transparent); background: color-mix(in srgb, var(--info) 10%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.chip.crit { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.chip.brand { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.member { white-space: nowrap; }
.notice { padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--panel); margin-bottom: 12px; }
.notice.error { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 6%, var(--panel)); }
.notice.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 7%, var(--panel)); }
.notice.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 6%, var(--panel)); }
.skeleton { color: var(--muted); padding: 24px; text-align: center; animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }

/* The landing page */
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; padding: 40px; border: 1px solid var(--line); border-radius: 18px; background: radial-gradient(120% 90% at 0% 0%, var(--glow), transparent 60%), var(--panel); box-shadow: var(--shadow-lg); }
.hero .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(30px, 4.2vw, 46px); line-height: 1.05; letter-spacing: -.03em; margin: 12px 0 14px; font-weight: 780; }
.hero p { font-size: 15.5px; color: var(--ink-2); margin: 0 0 22px; max-width: 58ch; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hero-art { display: grid; place-items: center; }
.hero-art svg { width: 100%; max-width: 360px; height: auto; }
.wave { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.wave.a { stroke: var(--accent-2); } .wave.b { stroke: color-mix(in srgb, var(--accent-2) 55%, var(--line-2)); } .wave.c { stroke: var(--line-2); }
.node-dot { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 14px; }
.section-title h2 { font-size: 19px; letter-spacing: -.01em; margin: 0; }
.section-title span { color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); transition: border-color .14s, transform .14s; }
a.card:hover { text-decoration: none; border-color: var(--accent-2); transform: translateY(-1px); }
.card .icon { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.card .icon svg { width: 18px; height: 18px; }
.card.quiet .icon { background: var(--panel-2); color: var(--muted); }
.card h3 { font-size: 15px; margin: 2px 0 0; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.card .subs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; counter-reset: step; }
.step { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); }
.step::before { counter-increment: step; content: counter(step); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 12px/1 var(--mono); margin-bottom: 8px; }
.step h3 { margin: 0 0 4px; font-size: 14px; }
.step p { margin: 0; color: var(--muted); font-size: 13px; }

/* A section page */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 18px; margin-bottom: 18px; }
.page-head .icon { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); }
.page-head .icon svg { width: 24px; height: 24px; }
.page-head h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin: 0; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.empty { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 48px 20px; border: 1px dashed var(--line-2); border-radius: 14px; background: var(--panel); color: var(--muted); }
.empty svg { width: 36px; height: 36px; color: var(--axis); }
.empty h3 { margin: 0; color: var(--ink); font-size: 16px; }
.empty p { margin: 0; max-width: 52ch; }
.signin { max-width: 520px; margin: 8vh auto; text-align: center; background: radial-gradient(100% 80% at 50% 0%, var(--glow), transparent 70%), var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; box-shadow: var(--shadow-lg); }
.signin img { width: 96px; height: 96px; padding: 12px; border-radius: 24px; background: radial-gradient(circle at 50% 30%, #1d1d20, #0a0a0b); }
.signin h2 { font-size: 21px; margin: 12px 0 6px; }
.signin .btn { margin-top: 14px; }

@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding: 28px 22px; } .hero-art { display: none; } }
@media (max-width: 760px) {
  #toggle { display: inline-grid; }
  .rail { position: fixed; left: 0; transform: translateX(-100%); transition: transform .18s; box-shadow: var(--shadow-lg); }
  .app.open .rail { transform: none; }
  .topbar { padding: 8px 16px; }
  main { padding: 18px 16px 40px; }
  .scope select { max-width: 160px; }
}
@media (prefers-reduced-motion: reduce) { .rail, .card { transition: none; } .skeleton { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" aria-label="Sections">
    <a class="brand" href="#/"><img src="/logo.png?v=2" alt="" width="32" height="32"><span><b>DataSea</b><small>Building Agentic Intelligence</small></span></a>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div class="foot" id="viewer"></div>
  </aside>
  <div class="column">
    <header class="topbar">
      <button class="icon-btn" id="toggle" type="button" aria-label="Show sections" title="Show sections">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <span class="topbar-spacer"></span>
      <div id="scope" class="scope"></div>
      <button type="button" class="icon-btn" id="theme" title="Theme: system, light, or dark" aria-label="Change theme">◐</button>
    </header>
    <main id="main"><p class="skeleton">Loading…</p></main>
  </div>
</div>
<script src="/app.js" defer></script>
<script src="/flows.js" defer></script>
</body>
</html>
